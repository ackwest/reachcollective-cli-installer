name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: sh -n install.sh

      - name: Validate release manifest
        run: python3 -m json.tool latest.json
