name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: sh -n install.sh

      - name: Validate release manifest
        run: python3 -m json.tool latest.json

  validate-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate and test with Windows PowerShell 5.1
        shell: powershell
        run: |
          try {
            [void][scriptblock]::Create((Get-Content -Raw install.ps1))
            .\tests\install.tests.ps1
          }
          catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }

      - name: Validate and test with PowerShell 7
        shell: pwsh
        run: |
          try {
            [void][scriptblock]::Create((Get-Content -Raw install.ps1))
            .\tests\install.tests.ps1
          }
          catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }
